[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bookanalyst"
version = "0.7.0"
description = "Local visual mathematical PDF to LaTeX workbench"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20",
  "pypdf>=5,<7",
  "pypdfium2>=4,<6",
  "python-dotenv>=1,<2",
  "jsonschema>=4,<5",
  "pillow>=12,<13",
  "openai-codex==0.147.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
bookanalyst = "bookanalyst.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookanalyst = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
