<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookAnalyst</title><link rel="stylesheet" href="/static/style.css"></head>
<body><aside><a class="brand" href="#library"><b>Ba</b><span>BookAnalyst<small>数学内容 · 视觉转换</small></span></a><nav><button data-nav="library" class="active">书库</button><button data-nav="runs">运行记录</button><button data-nav="settings">模型连接</button></nav><footer><i></i>本地工作台 <span>v0.7</span></footer></aside>
<div class="workspace"><header><span id="breadcrumb">书库</span><span class="muted">PDF → TeX</span></header><main id="main" aria-live="polite"><p>正在连接本地服务…</p></main></div>
<dialog id="new-run"><form id="run-form"><div class="row"><h2>创建视觉转换</h2><button type="button" data-close class="icon" aria-label="关闭">×</button></div><label>文献<select name="book_id" required></select></label><div class="fields"><label>起始 PDF 页<input name="start_page" type="number" value="1" min="1" required></label><label>结束 PDF 页<input name="end_page" type="number" min="1" required></label><label>每批页数<input name="pages_per_task" type="number" value="3" min="1" required></label><label>并行任务数<input name="llm_concurrency" type="number" value="2" min="1" required></label><label>模型连接<select name="connection_id"></select></label><label>模型<select name="model_id"><option value="">读取上游模型…</option></select></label><label>转换与衔接思考强度<select name="reasoning_effort"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option><option value="xhigh">更高</option></select></label><label>全书设置／结构修复思考强度<select name="structure_effort"><option value="high">高</option><option value="xhigh" selected>xhigh</option></select></label><label>设置参考页（可选）<input name="setup_pages" placeholder="如 1,2,3；默认开头 3 页"></label></div><p class="hint">转换任务只接收本批页图。目录与前置页用于全书设置，衔接统一在转换后处理；转换时直接写原生标签与引用，最后统一修复标题与重名，编号由全书计数器产生。</p><p id="run-error" class="error"></p><div class="row end"><button type="submit" class="primary">开始转换</button></div></form></dialog>
<input id="upload" type="file" accept="application/pdf" hidden><div id="toast" role="status" hidden></div><script type="module" src="/static/app.js"></script></body></html>
