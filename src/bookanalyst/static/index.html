<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookAnalyst</title><meta name="theme-color" content="#f5f4f0"><link rel="icon" type="image/png" href="/static/bookanalyst-icon.png"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/library.css"><link rel="stylesheet" href="/static/pdf-preview.css"><link rel="stylesheet" href="/static/providers.css"></head>
<body><a class="skip-link" href="#main">跳到主要内容</a><aside><a class="brand" href="#library"><img class="brand-icon" src="/static/bookanalyst-icon.png" width="44" height="44" alt=""><span>BookAnalyst<small>你的数学文献工作台</small></span></a><div class="nav-label">工作空间</div><nav aria-label="主要导航"><button data-nav="library" class="active"><span aria-hidden="true">▤</span>书库</button><button data-nav="images"><span aria-hidden="true">▧</span>图片修复</button><button data-nav="templates"><span aria-hidden="true">T<span class="tex-e">E</span>X</span>TeX 模板</button><button data-nav="structure"><span aria-hidden="true">▦</span>TeX 文件结构</button><button data-nav="runs"><span aria-hidden="true">◷</span>运行记录</button><button data-nav="settings"><span aria-hidden="true">⚙</span>模型设置</button></nav><div class="sidebar-note"><span>从原页，到可编辑的数学。</span><p>保留表达，让文献继续生长。</p></div><footer><i></i><span id="app-mode">本地工作台</span><small>v0.7.1</small></footer></aside>
<div class="workspace"><header><div class="row"><span class="muted">工作空间</span><span class="muted">/</span><span id="breadcrumb">书库</span></div><div class="row"><span class="local-indicator">本地存储</span><button data-nav="settings" class="header-settings">模型设置</button></div></header><main id="main" tabindex="-1"><div class="loading" role="status">正在连接本地服务…</div></main></div>
<dialog id="new-run"><form id="run-form"><div class="row"><h2>创建视觉转换</h2><button type="button" data-close class="icon" aria-label="关闭">×</button></div><label>文献<select name="book_id" required></select></label><div class="fields"><label>起始 PDF 页<input name="start_page" type="number" value="1" min="1" required></label><label>结束 PDF 页<input name="end_page" type="number" min="1" required></label><label>每批页数<input name="pages_per_task" type="number" value="3" min="1" required></label><label>并行任务数<input name="llm_concurrency" type="number" value="2" min="1" required></label><label>设置参考页（可选）<input name="setup_pages" placeholder="如 1,2,3；默认开头 3 页"></label></div><p class="hint">转换任务只接收本批页图。目录与前置页用于全书设置，衔接统一在转换后处理；转换时直接写原生标签与引用，先统一标题层级，再单独处理标签与引用，编号由全书计数器产生。</p><p class="hint">各阶段使用设置页保存的模型和思考强度。</p><p id="run-error" class="error"></p><div class="row end"><button type="submit" class="primary">开始转换</button></div></form></dialog>
<input id="upload" type="file" accept="application/pdf,.pdf" multiple hidden><div id="toast" role="status" hidden></div><script type="module" src="/static/app.js"></script></body></html>
